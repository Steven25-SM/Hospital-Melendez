<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Mis Facturas - Hospital Melendez</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

</head>

<body>

<div th:replace="fragments/header :: header"></div>


<main class="container py-5">

    <div class="text-center mb-5">

        <h2 class="fw-bold">
            Mis Facturas
        </h2>

        <p class="text-muted">
            Consulta tus pagos y facturas registradas.
        </p>

    </div>


    <div th:if="${#lists.isEmpty(listaFacturas)}"
         class="alert alert-info text-center">

        No tienes facturas registradas actualmente.

    </div>


    <div th:if="${not #lists.isEmpty(listaFacturas)}"
         class="table-responsive">

        <table class="table table-hover align-middle">

            <thead class="table-light">

            <tr>

                <th>Fecha de emisión</th>
                <th>Descripción</th>
                <th>Total</th>
                <th>Estado</th>

            </tr>

            </thead>

            <tbody>

            <tr th:each="factura : ${listaFacturas}">

                <td th:text="${factura.fechaEmision}">
                    2026-09-07
                </td>

                <td th:text="${factura.descripcion}">
                    Consulta médica
                </td>

                <td>
                    S/.
                    <span th:text="${factura.total}">
                        150.00
                    </span>
                </td>

                <td>

                    <span class="badge bg-success"
                          th:if="${factura.estado == 'PAGADA'}">

                        PAGADA

                    </span>

                    <span class="badge bg-warning text-dark"
                          th:if="${factura.estado != 'PAGADA'}"
                          th:text="${factura.estado}">

                        PENDIENTE

                    </span>

                </td>

            </tr>

            </tbody>

        </table>

    </div>

</main>

</body>
</html>
