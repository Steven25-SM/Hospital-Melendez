<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Hospitalización - Hospital Melendez</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<div th:replace="fragments/header :: header"></div>

<div class="container mt-4">
    <h2 class="mb-4 text-center text-primary fw-bold">Gestión de Hospitalizaciones</h2>

    <div class="card shadow-sm mb-4">
        <div class="card-body">


            <form th:action="@{/hospitalizacion/guardar}" th:object="${hospitalizacion}" method="post" class="mt-3">
                <input type="hidden" th:field="*{idHosp}">

                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label fw-semibold">Paciente</label>
                        <select th:field="*{paciente.idPaciente}" class="form-select" required>
                            <option value="">Seleccione Paciente</option>
                            <option th:each="p : ${listaPacientes}"
                                    th:value="${p.idPaciente}"
                                    th:text="${p.nombres + ' ' + p.apellidos}">
                            </option>
                        </select>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label fw-semibold">Habitación</label>
                        <select th:field="*{habitacion.idHabitacion}" class="form-select" required>
                            <option value="">Seleccione Habitación</option>
                            <option th:each="h : ${listaHabitaciones}"
                                    th:value="${h.idHabitacion}"
                                    th:text="${'Hab. ' + h.numero + ' (' + h.tipo + ')'}">
                            </option>
                        </select>
                    </div>

                    <div class="col-md-2">
                        <label class="form-label fw-semibold">Fecha Ingreso</label>
                        <input type="date" th:field="*{fechaIngreso}" class="form-control"
                               th:value="${#temporals.format(hospitalizacion.fechaIngreso, 'yyyy-MM-dd')}" required>
                    </div>

                    <div class="col-md-2">
                        <label class="form-label fw-semibold">Fecha Alta</label>
                        <input type="date" th:field="*{fechaAlta}" class="form-control"
                               th:value="${#temporals.format(hospitalizacion.fechaAlta, 'yyyy-MM-dd')}">
                    </div>

                    <div class="col-md-12">
                        <label class="form-label fw-semibold">Diagnóstico</label>
                        <textarea th:field="*{diagnostico}" class="form-control" placeholder="Ingrese diagnóstico del paciente" rows="2"></textarea>
                    </div>

                    <div class="col-md-2 d-flex align-items-end">
                        <button type="submit" class="btn btn-primary w-100">
                            <span th:text="${hospitalizacion.idHosp != null} ? 'Actualizar' : 'Guardar'"></span>
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <table class="table table-striped align-middle">
        <thead class="table-dark text-center">
        <tr>
            <th>ID</th>
            <th>Paciente</th>
            <th>Habitación</th>
            <th>Fecha Ingreso</th>
            <th>Fecha Alta</th>
            <th>Diagnóstico</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="h : ${listaHospitalizaciones}">
            <td th:text="${h.idHosp}"></td>
            <td th:text="${h.paciente.nombres + ' ' + h.paciente.apellidos}"></td>
            <td th:text="${'Hab. ' + h.habitacion.numero}"></td>
            <td th:text="${#temporals.format(h.fechaIngreso, 'yyyy-MM-dd')}"></td>
            <td th:text="${#temporals.format(h.fechaAlta, 'yyyy-MM-dd')}"></td>
            <td th:text="${h.diagnostico}"></td>
            <td class="text-center">
                <a th:href="@{'/hospitalizacion/editar/' + ${h.idHosp}}" class="btn btn-warning btn-sm me-1">Editar</a>
                <a th:href="@{'/hospitalizacion/eliminar/' + ${h.idHosp}}" class="btn btn-danger btn-sm"
                   onclick="return confirm('¿Seguro que deseas eliminar esta hospitalización?')">Eliminar</a>
            </td>
        </tr>
        </tbody>
    </table>

    <div class="text-center mt-3">
        <a th:href="@{/}" class="btn btn-secondary">Volver al Inicio</a>
    </div>
</div>
</body>
</html>
