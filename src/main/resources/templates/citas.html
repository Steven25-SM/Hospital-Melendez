<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Citas Médicas - Hospital Melendez</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<div th:replace="fragments/header :: header"></div>

<div class="container mt-4">
    <h2 class="mb-4 text-center text-primary fw-bold">Gestión de Citas Médicas</h2>

    <div class="card shadow-sm mb-4">
        <div class="card-body">

            <form th:action="@{/citas/guardar}" th:object="${cita}" method="post" class="mt-3">
                <input type="hidden" th:field="*{idCita}">

                <div class="row g-3">
                    <div class="col-md-3">
                        <label class="form-label fw-semibold">Paciente</label>
                        <select th:field="*{paciente.idPaciente}" class="form-select" required>
                            <option value="">Seleccione Paciente</option>
                            <option th:each="p : ${listaPacientes}"
                                    th:value="${p.idPaciente}"
                                    th:text="${p.nombres + ' ' + p.apellidos}">
                            </option>
                        </select>
                    </div>

                    <div class="col-md-3">
                        <label class="form-label fw-semibold">Médico</label>
                        <select th:field="*{medico.idMedico}" class="form-select" required>
                            <option value="">Seleccione Médico</option>
                            <option th:each="m : ${listaMedicos}"
                                    th:value="${m.idMedico}"
                                    th:text="${m.nombres + ' ' + m.apellidos}">
                            </option>
                        </select>
                    </div>

                    <div class="col-md-2">
                        <label class="form-label fw-semibold">Fecha</label>
                        <input type="date" th:field="*{fecha}" class="form-control"
                               th:value="${#temporals.format(cita.fecha, 'yyyy-MM-dd')}" required>
                    </div>

                    <div class="col-md-2">
                        <label class="form-label fw-semibold">Hora</label>
                        <input type="time" th:field="*{hora}" class="form-control"
                               th:value="${#temporals.format(cita.hora, 'HH:mm')}" required>
                    </div>

                    <div class="col-md-2 d-flex align-items-end">
                        <button type="submit" class="btn btn-primary w-100">
                            <span th:text="${cita.idCita != null} ? 'Actualizar' : 'Guardar'"></span>
                        </button>
                    </div>
                </div>

                <div class="row g-3 mt-2">
                    <div class="col-md-12">
                        <label class="form-label fw-semibold">Motivo / Descripción</label>
                        <textarea th:field="*{motivo}" class="form-control" placeholder="Describa el motivo de la cita" rows="2"></textarea>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <table class="table table-striped align-middle">
        <thead class="table-dark text-center">
        <tr>
            <th>ID</th>
            <th>Paciente</th>
            <th>Médico</th>
            <th>Fecha</th>
            <th>Hora</th>
            <th>Motivo</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="c : ${listaCitas}">
            <td th:text="${c.idCita}"></td>
            <td th:text="${c.paciente.nombres + ' ' + c.paciente.apellidos}"></td>
            <td th:text="${c.medico.nombres + ' ' + c.medico.apellidos}"></td>
            <td th:text="${#temporals.format(c.fecha, 'yyyy-MM-dd')}"></td>
            <td th:text="${#temporals.format(c.hora, 'HH:mm')}"></td>
            <td th:text="${c.motivo}"></td>
            <td class="text-center">
                <a th:href="@{'/citas/editar/' + ${c.idCita}}" class="btn btn-warning btn-sm me-1">Editar</a>
                <a th:href="@{'/citas/eliminar/' + ${c.idCita}}" class="btn btn-danger btn-sm"
                   onclick="return confirm('¿Seguro que deseas eliminar esta cita?')">Eliminar</a>
            </td>
        </tr>
        </tbody>
    </table>

    <div class="text-center mt-3">
        <a th:href="@{/}" class="btn btn-secondary">Volver al Inicio</a>
    </div>
</div>
</body>
</html>
