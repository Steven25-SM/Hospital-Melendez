<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Mis Citas - Hospital Melendez</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

</head>

<body>

<div th:replace="fragments/header :: header"></div>


<main class="container py-5">

    <div class="text-center mb-5">

        <h2 class="fw-bold">
            Agendar una Cita
        </h2>

        <p class="text-muted">
            Selecciona un médico y el horario que prefieras.
        </p>

    </div>

    <div class="row justify-content-center mb-5">

        <div class="col-lg-7">

            <div class="card shadow-sm border-0 rounded-4">

                <div class="card-body p-4">

                    <h5 class="fw-bold mb-4">
                        Nueva cita
                    </h5>

                    <form th:action="@{/citas/agendar}"
                          th:object="${cita}"
                          method="post">

                        <div class="mb-3">

                            <label class="form-label fw-semibold">
                                Médico
                            </label>

                            <select th:field="*{medico}"
                                    class="form-select"
                                    required>

                                <option value="">
                                    Seleccione un médico
                                </option>

                                <option th:each="medico : ${listaMedicos}"
                                        th:value="${medico.idMedico}"
                                        th:text="${medico.nombres + ' ' + medico.apellidos + ' - ' + medico.especialidad}">
                                </option>

                            </select>

                        </div>

                        <div class="mb-3">

                            <label class="form-label fw-semibold">
                                Fecha
                            </label>

                            <input type="date"
                                   th:field="*{fecha}"
                                   class="form-control"
                                   required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label fw-semibold">
                                Hora
                            </label>

                            <input type="time"
                                   th:field="*{hora}"
                                   class="form-control"
                                   required>

                        </div>

                        <div class="mb-4">

                            <label class="form-label fw-semibold">
                                Motivo de la consulta
                            </label>

                            <textarea th:field="*{motivo}"
                                      class="form-control"
                                      rows="3"
                                      required>
                            </textarea>

                        </div>


                        <button type="submit"
                                class="btn btn-primary w-100 fw-bold">

                            Agendar cita

                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

    <div>

        <h4 class="fw-bold mb-4">
            Mis citas
        </h4>


        <div th:if="${#lists.isEmpty(listaCitas)}"
             class="alert alert-info">

            No tienes citas registradas actualmente.

        </div>


        <div th:if="${not #lists.isEmpty(listaCitas)}"
             class="table-responsive">

            <table class="table table-hover align-middle">

                <thead class="table-light">

                <tr>

                    <th>Fecha</th>
                    <th>Hora</th>
                    <th>Médico</th>
                    <th>Motivo</th>
                    <th>Estado</th>

                </tr>

                </thead>

                <tbody>

                <tr th:each="cita : ${listaCitas}">

                    <td th:text="${cita.fecha}">
                        2026-09-10
                    </td>

                    <td th:text="${cita.hora}">
                        10:00
                    </td>

                    <td th:text="${cita.medico.nombres + ' ' + cita.medico.apellidos}">
                        Médico
                    </td>

                    <td th:text="${cita.motivo}">
                        Consulta
                    </td>

                    <td>

                        <span class="badge bg-warning text-dark"
                              th:text="${cita.estado}">
                            PENDIENTE
                        </span>

                    </td>

                </tr>

                </tbody>

            </table>

        </div>

    </div>

</main>

</body>
</html>
