<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Facturación - Hospital Melendez</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<div th:replace="fragments/header :: header"></div>

<div class="container mt-4">
    <h2 class="mb-4 text-center text-primary fw-bold">Gestión de Facturación</h2>

    <div class="card shadow-sm mb-4">
        <div class="card-body">

            <form th:action="@{/facturacion/guardar}" th:object="${factura}" method="post" class="mt-3">
                <input type="hidden" th:field="*{idFactura}">

                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label fw-semibold">Paciente</label>
                        <select th:field="*{paciente.idPaciente}" class="form-select" required>
                            <option value="">Seleccione Paciente</option>
                            <option th:each="p : ${listaPacientes}"
                                    th:value="${p.idPaciente}"
                                    th:text="${p.nombres + ' ' + p.apellidos}">
                            </option>
                        </select>
                    </div>

                    <div class="col-md-3">
                        <label class="form-label fw-semibold">Fecha de Emisión</label>
                        <input type="date" th:field="*{fechaEmision}" class="form-control"
                               th:value="${#temporals.format(factura.fechaEmision, 'yyyy-MM-dd')}" required>
                    </div>

                    <div class="col-md-3">
                        <label class="form-label fw-semibold">Total (S/)</label>
                        <input type="number" th:field="*{total}" step="0.01" min="0" class="form-control" placeholder="Ingrese monto total" required>
                    </div>

                    <div class="col-md-2">
                        <label class="form-label fw-semibold">Estado</label>
                        <select th:field="*{estado}" class="form-select">
                            <option value="PENDIENTE">Pendiente</option>
                            <option value="PAGADO">Pagado</option>
                        </select>
                    </div>

                    <div class="col-md-12">
                        <label class="form-label fw-semibold">Descripción</label>
                        <textarea th:field="*{descripcion}" class="form-control" placeholder="Detalle de los servicios facturados" rows="2"></textarea>
                    </div>

                    <div class="col-md-2 d-flex align-items-end">
                        <button type="submit" class="btn btn-primary w-100">
                            <span th:text="${factura.idFactura != null} ? 'Actualizar' : 'Guardar'"></span>
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <table class="table table-striped align-middle">
        <thead class="table-dark text-center">
        <tr>
            <th>ID</th>
            <th>Paciente</th>
            <th>Fecha Emisión</th>
            <th>Total (S/)</th>
            <th>Estado</th>
            <th>Descripción</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="f : ${listaFacturas}">
            <td th:text="${f.idFactura}"></td>
            <td th:text="${f.paciente.nombres + ' ' + f.paciente.apellidos}"></td>
            <td th:text="${#temporals.format(f.fechaEmision, 'yyyy-MM-dd')}"></td>
            <td th:text="${f.total}"></td>
            <td th:text="${f.estado}"></td>
            <td th:text="${f.descripcion}"></td>
            <td class="text-center">
                <a th:href="@{'/facturacion/editar/' + ${f.idFactura}}" class="btn btn-warning btn-sm me-1">Editar</a>
                <a th:href="@{'/facturacion/eliminar/' + ${f.idFactura}}" class="btn btn-danger btn-sm"
                   onclick="return confirm('¿Seguro que deseas eliminar esta factura?')">Eliminar</a>
            </td>
        </tr>
        </tbody>
    </table>

    <div class="text-center mt-3">
        <a th:href="@{/}" class="btn btn-secondary">Volver al Inicio</a>
    </div>
</div>
</body>
</html>
