<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión - Hospital San Gabriel</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<div th:replace="fragments/header :: header"></div>

<div class="login-page">
    <div class="login-bg">
        <img th:src="@{https://previews.123rf.com/images/stylephotographs/stylephotographs1308/stylephotographs130800089/21380363-senior-doctor-talking-with-receptionist-at-hospital-reception.jpg}" alt="Fondo login" class="login-bg-img">
    </div>

    <div class="login-form-container text-start">
        <div class="login-card shadow-lg rounded-4 p-5">
            <div class="text-center mb-4">
                <img th:src="@{/images/header-logo.png}" alt="Logo" height="70" class="mb-3">
                <h3 class="text-white fw-bold mb-1">Bienvenido</h3>
            </div>

            <form method="post" action="/login">
                <div class="mb-3">
                    <label for="username" class="form-label text-white fw-semibold">Usuario</label>
                    <input type="text" name="username" id="username" class="form-control login-input" placeholder="Ingrese su usuario" required>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label text-white fw-semibold">Contraseña</label>
                    <input type="password" name="password" id="password" class="form-control login-input" placeholder="Ingrese su contraseña" required>
                </div>

                <button type="submit" class="btn btn-light w-100 fw-bold py-2 mb-3">Ingresar</button>
                <div th:if="${param.error}" class="alert alert-danger text-center mt-3 py-2">
                    Usuario o contraseña incorrectos
                </div>
                <div th:if="${param.logout}" class="alert alert-success text-center mt-3 py-2">
                    Sesión cerrada correctamente
                </div>



            </form>

            <p class="text-center text-light small mb-0">¿Olvidó su contraseña?</p>
        </div>
    </div>
</div>

</body>
</html>
