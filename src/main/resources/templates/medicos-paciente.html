<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Médicos - Hospital Melendez</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

</head>

<body>

<div th:replace="fragments/header :: header"></div>

<main class="container py-5">

    <div class="text-center mb-5">

        <h2 class="fw-bold">
            Nuestros Médicos
        </h2>

        <p class="text-muted">
            Consulta nuestros médicos disponibles para agendar una cita.
        </p>

    </div>

    <div class="row g-4">

        <div class="col-md-6 col-lg-4"
             th:each="medico : ${listaMedicos}">

            <div class="card shadow-sm border-0 h-100">

                <div class="card-body">

                    <h5 class="fw-bold"
                        th:text="${medico.nombres + ' ' + medico.apellidos}">
                        Nombre del médico
                    </h5>

                    <p class="text-primary fw-semibold"
                       th:text="${medico.especialidad}">
                        Especialidad
                    </p>

                    <p class="mb-2">
                        <strong>Colegiatura:</strong>
                        <span th:text="${medico.colegiatura}"></span>
                    </p>

                    <p class="mb-2">
                        <strong>Teléfono:</strong>
                        <span th:text="${medico.telefono}"></span>
                    </p>

                    <p class="mb-2">
                        <strong>Correo:</strong>
                        <span th:text="${medico.correo}"></span>
                    </p>

                    <span class="badge bg-success"
                          th:text="${medico.estado}">
                        ACTIVO
                    </span>

                </div>

            </div>

        </div>

    </div>

</main>

</body>
</html>
