<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Médicos - Hospital Melendez</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<div th:replace="fragments/header :: header"></div>

<div class="container mt-4">
    <h2 class="mb-4 text-center text-primary fw-bold">Gestión de Médicos</h2>

    <div class="card shadow-sm mb-4">
        <div class="card-body">


            <form th:action="@{/medicos/guardar}" th:object="${medico}" method="post" class="mt-3">
                <input type="hidden" th:field="*{idMedico}">

                <div class="row g-3">
                    <div class="col-md-3">
                        <label class="form-label fw-semibold">Nombres</label>
                        <input type="text" th:field="*{nombres}" class="form-control" placeholder="Ingrese nombres" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label fw-semibold">Apellidos</label>
                        <input type="text" th:field="*{apellidos}" class="form-control" placeholder="Ingrese apellidos" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label fw-semibold">Especialidad</label>
                        <input type="text" th:field="*{especialidad}" class="form-control" placeholder="Ingrese especialidad" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label fw-semibold">N° Colegiatura</label>
                        <input type="text" th:field="*{colegiatura}" class="form-control" placeholder="Ingrese N° de colegiatura" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label fw-semibold">Teléfono</label>
                        <input type="text" th:field="*{telefono}" class="form-control" placeholder="Ingrese teléfono">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label fw-semibold">Correo</label>
                        <input type="email" th:field="*{correo}" class="form-control" placeholder="Ingrese correo electrónico">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label fw-semibold">Estado</label>
                        <select th:field="*{estado}" class="form-select">
                            <option value="activo">Activo</option>
                            <option value="inactivo">Inactivo</option>
                        </select>
                    </div>

                    <div class="col-md-2 d-flex align-items-end">
                        <button type="submit" class="btn btn-primary w-100">
                            <span th:text="${medico.idMedico != null} ? 'Actualizar' : 'Guardar'"></span>
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <table class="table table-striped align-middle">
        <thead class="table-dark text-center">
        <tr>
            <th>ID</th>
            <th>Nombres</th>
            <th>Apellidos</th>
            <th>Especialidad</th>
            <th>Colegiatura</th>
            <th>Teléfono</th>
            <th>Correo</th>
            <th>Estado</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="m : ${listaMedicos}">
            <td th:text="${m.idMedico}"></td>
            <td th:text="${m.nombres}"></td>
            <td th:text="${m.apellidos}"></td>
            <td th:text="${m.especialidad}"></td>
            <td th:text="${m.colegiatura}"></td>
            <td th:text="${m.telefono}"></td>
            <td th:text="${m.correo}"></td>
            <td th:text="${m.estado}"></td>
            <td class="text-center">
                <a th:href="@{'/medicos/editar/' + ${m.idMedico}}" class="btn btn-warning btn-sm me-1">Editar</a>
                <a th:href="@{'/medicos/eliminar/' + ${m.idMedico}}" class="btn btn-danger btn-sm"
                   onclick="return confirm('¿Seguro que deseas eliminar este médico?')">Eliminar</a>
            </td>
        </tr>
        </tbody>
    </table>

    <div class="text-center mt-3">
        <a th:href="@{/}" class="btn btn-secondary">Volver al Inicio</a>
    </div>
</div>
</body>
</html>
