<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Registro - Hospital Melendez</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>

<body>

<div th:replace="fragments/header :: header"></div>

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card shadow-lg border-0 rounded-4">

                <div class="card-body p-5">

                    <div class="text-center mb-4">

                        <img th:src="@{/images/header-logo.png}"
                             alt="Logo"
                             height="70"
                             class="mb-3">

                        <h2 class="fw-bold">
                            Registro de Paciente
                        </h2>

                        <p class="text-muted">
                            Crea tu cuenta para gestionar tus citas médicas.
                        </p>

                    </div>

                    <div th:if="${param.error}"
                         class="alert alert-danger">

                        <span th:if="${param.error[0] == 'usuario'}">
                            El nombre de usuario ya está registrado.
                        </span>

                        <span th:if="${param.error[0] == 'dni'}">
                            El DNI ya está registrado.
                        </span>

                        <span th:if="${param.error[0] == 'correo'}">
                            El correo ya está registrado.
                        </span>

                    </div>

                    <form th:action="@{/registro}"
                          th:object="${paciente}"
                          method="post">

                        <h5 class="fw-bold mb-3">
                            Datos personales
                        </h5>

                        <div class="row">

                            <div class="col-md-6 mb-3">
                                <label class="form-label">
                                    DNI
                                </label>

                                <input type="text"
                                       th:field="*{dni}"
                                       class="form-control"
                                       required>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">
                                    Nombres
                                </label>

                                <input type="text"
                                       th:field="*{nombres}"
                                       class="form-control"
                                       required>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">
                                    Apellidos
                                </label>

                                <input type="text"
                                       th:field="*{apellidos}"
                                       class="form-control"
                                       required>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">
                                    Fecha de nacimiento
                                </label>

                                <input type="date"
                                       th:field="*{fechaNacimiento}"
                                       class="form-control"
                                       required>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">
                                    Sexo
                                </label>

                                <select th:field="*{sexo}"
                                        class="form-select"
                                        required>

                                    <option value="">
                                        Seleccione
                                    </option>

                                    <option value="M">
                                        Masculino
                                    </option>

                                    <option value="F">
                                        Femenino
                                    </option>

                                </select>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">
                                    Teléfono
                                </label>

                                <input type="text"
                                       th:field="*{telefono}"
                                       class="form-control">
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">
                                    Correo
                                </label>

                                <input type="email"
                                       th:field="*{correo}"
                                       class="form-control"
                                       required>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">
                                    Dirección
                                </label>

                                <input type="text"
                                       th:field="*{direccion}"
                                       class="form-control">
                            </div>

                        </div>

                        <hr class="my-4">

                        <h5 class="fw-bold mb-3">
                            Datos de acceso
                        </h5>

                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Nombre de usuario
                                </label>

                                <input type="text"
                                       name="nombreUsuario"
                                       class="form-control"
                                       required>

                            </div>

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Contraseña
                                </label>

                                <input type="password"
                                       name="contrasena"
                                       class="form-control"
                                       required>

                            </div>

                        </div>

                        <button type="submit"
                                class="btn btn-primary w-100 py-2 fw-bold">

                            Crear cuenta

                        </button>

                    </form>

                    <div class="text-center mt-4">

                        <a th:href="@{/login}"
                           class="text-decoration-none">

                            ¿Ya tienes una cuenta? Inicia sesión

                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
